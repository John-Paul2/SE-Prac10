name: Geometry DevOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stage1-code-quality:
    name: "Stage 1 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q .

  stage2-testing:
    name: "Stage 2 Automated Testing"
    runs-on: ubuntu-latest
    needs: stage1-code-quality
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v

  stage3-security:
    name: "Stage 3 Security Scanning"
    runs-on: ubuntu-latest
    needs: stage2-testing
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan Python code
        run: bandit -r -x ./.github .

  stage4-build:
    name: "Stage 4 Build Artifact"
    runs-on: ubuntu-latest
    needs: stage3-security
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Package geometry module
        run: |
          mkdir -p dist
          cp geometry.py dist/
          cp test_geometry.py dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry-build
          path: dist/
